name: Application contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/application/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/application-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and commit pinned lockfile if absent
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml already versioned"
            exit 0
          fi
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: freeze K7 pnpm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

  structural-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run executable runtime structural contracts
        run: node --test tests/application/*.test.mjs
