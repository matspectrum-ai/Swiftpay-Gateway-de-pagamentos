name: Application contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/application/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/application-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run executable runtime structural contracts
        run: pnpm test
      - name: Typecheck application workspace
        run: pnpm typecheck
      - name: Build application workspace
        run: pnpm build
