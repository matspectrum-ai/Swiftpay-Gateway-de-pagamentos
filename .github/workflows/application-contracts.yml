name: Application contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/application/**"
      - "scripts/provision-local-runtime-identities"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "supabase/**"
      - ".github/workflows/application-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Generate and commit A1 lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git diff --check -- pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh lockfile for A1 auth package"
          git push origin "HEAD:${{ github.head_ref }}"

  application-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck application workspace
        run: pnpm typecheck
      - name: Build application workspace
        run: pnpm build
      - name: Run application contracts
        run: pnpm test

  runtime-database-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SWIFTPAY_API_DATABASE_URL: postgresql://swiftpay_api_runtime:local_api_runtime_only@127.0.0.1:54322/postgres
      SWIFTPAY_WORKER_DATABASE_URL: postgresql://swiftpay_worker_runtime:local_worker_runtime_only@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Provision K6 local runtime identities
        run: bash scripts/provision-local-runtime-identities
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build
      - name: Run real runtime database acceptance
        run: bash tests/application/003_runtime_database_integration.sh
