name: A23 lockfile refresh

on:
  push:
    branches:
      - agent/foundation-phase-0
    paths:
      - apps/checkout/package.json
      - .github/workflows/a23-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-phase-0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(a23): freeze checkout workspace lockfile"
          git push origin HEAD:agent/foundation-phase-0
