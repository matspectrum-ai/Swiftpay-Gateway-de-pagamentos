name: Database contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "ops/postgres/**"
      - "scripts/seed-local-sandbox"
      - "scripts/provision-local-runtime-identities"
      - "scripts/verify-runtime-database-boundary"
      - ".github/workflows/database-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a23-contract-gap-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-phase-0
      - name: Repair A23 migration if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260819163000_hosted_pix_checkout_payment_links.sql')
          text = path.read_text()
          changed = False

          old_extract = "pg_catalog.extract(epoch from ((v_canonical_window_started_at + interval '60 seconds') - v_now))"
          new_extract = "extract(epoch from ((v_canonical_window_started_at + interval '60 seconds') - v_now))"
          if old_extract in text:
              if text.count(old_extract) != 1:
                  raise SystemExit('qualified EXTRACT is not unique')
              text = text.replace(old_extract, new_extract, 1)
              changed = True

          rls = 'alter table app.payment_links enable row level security;'
          if rls not in text:
              boundary = """create index payment_links_merchant_created_idx
    on app.payment_links(merchant_id, environment, created_at desc, id desc);

revoke all on table app.payment_links
"""
              replacement = """create index payment_links_merchant_created_idx
    on app.payment_links(merchant_id, environment, created_at desc, id desc);

alter table app.payment_links enable row level security;

revoke all on table app.payment_links
"""
              if text.count(boundary) != 1:
                  raise SystemExit('payment_links index/revoke boundary is not unique')
              text = text.replace(boundary, replacement, 1)
              changed = True

          path.write_text(text)
          Path('.a23-migration-changed').write_text('1' if changed else '0')
          PY
      - name: Commit migration repair when needed
        run: |
          if [ "$(cat .a23-migration-changed)" != "1" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260819163000_hosted_pix_checkout_payment_links.sql
          git commit -m "fix(a23): repair checkout migration bootstrap"
          git push origin HEAD:agent/foundation-phase-0

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Run pgTAP database contracts
        run: supabase test db supabase/tests/database

  sandbox-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Load deterministic local sandbox fixture
        run: bash scripts/seed-local-sandbox
      - name: Reload fixture to prove idempotency
        run: bash scripts/seed-local-sandbox
      - name: Run K5 fixture contracts
        run: supabase test db supabase/tests/fixtures

  runtime-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Provision production-like local runtime identities
        run: bash scripts/provision-local-runtime-identities
      - name: Run K6 structural runtime contracts
        run: supabase test db supabase/tests/runtime
      - name: Verify API runtime identity through its own connection
        env:
          SWIFTPAY_API_DATABASE_URL: postgresql://swiftpay_api_runtime:local_api_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary api
      - name: Verify worker runtime identity through its own connection
        env:
          SWIFTPAY_WORKER_DATABASE_URL: postgresql://swiftpay_worker_runtime:local_worker_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary worker
