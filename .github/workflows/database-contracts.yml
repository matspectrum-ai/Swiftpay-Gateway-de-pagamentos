name: Database contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "ops/postgres/**"
      - "scripts/seed-local-sandbox"
      - "scripts/provision-local-runtime-identities"
      - "scripts/verify-runtime-database-boundary"
      - ".github/workflows/database-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-a1-structural-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile K4 allowlist and A1 proconfig assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          k4 = Path('supabase/tests/database/028_trusted_runtime_database_boundary_schema.test.sql')
          text = k4.read_text()
          old = """    1::bigint,\n    'swiftpay_api has exactly one current app EXECUTE grant'\n);"""
          new = """    4::bigint,\n    'swiftpay_api has exactly four current app EXECUTE grants'\n);"""
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              "'swiftpay_api can execute only the K4 dashboard context helper'",
              "'swiftpay_api retains K4 dashboard context helper execution'",
              1,
          )
          k4.write_text(text)

          a1 = Path('supabase/tests/database/030_api_credential_token_auth_schema.test.sql')
          text = a1.read_text()
          text = text.replace(
              "select proconfig::text from pg_proc",
              "select array_to_string(proconfig, ',') from pg_proc",
          )
          text = text.replace(
              "'{search_path=\"\"}'::text",
              "'search_path=\"\"'::text",
          )
          a1.write_text(text)
          PY

          if git diff --quiet -- supabase/tests/database/028_trusted_runtime_database_boundary_schema.test.sql supabase/tests/database/030_api_credential_token_auth_schema.test.sql; then
            echo "Structural tests already reconciled"
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/028_trusted_runtime_database_boundary_schema.test.sql supabase/tests/database/030_api_credential_token_auth_schema.test.sql
          git commit -m "test: reconcile A1 trusted runtime structural contracts"
          git push origin "HEAD:${{ github.head_ref }}"

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Run pgTAP database contracts
        run: supabase test db supabase/tests/database

  sandbox-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Load deterministic local sandbox fixture
        run: bash scripts/seed-local-sandbox
      - name: Reload fixture to prove idempotency
        run: bash scripts/seed-local-sandbox
      - name: Run K5 fixture contracts
        run: supabase test db supabase/tests/fixtures

  runtime-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Provision production-like local runtime identities
        run: bash scripts/provision-local-runtime-identities
      - name: Run K6 structural runtime contracts
        run: supabase test db supabase/tests/runtime
      - name: Verify API runtime identity through its own connection
        env:
          SWIFTPAY_API_DATABASE_URL: postgresql://swiftpay_api_runtime:local_api_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary api
      - name: Verify worker runtime identity through its own connection
        env:
          SWIFTPAY_WORKER_DATABASE_URL: postgresql://swiftpay_worker_runtime:local_worker_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary worker
