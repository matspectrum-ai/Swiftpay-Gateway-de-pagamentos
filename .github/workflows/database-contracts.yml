name: Database contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "ops/postgres/**"
      - "scripts/seed-local-sandbox"
      - "scripts/provision-local-runtime-identities"
      - "scripts/verify-runtime-database-boundary"
      - ".github/workflows/database-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Generate and commit A1 foundation migration if absent
        run: |
          set -euo pipefail
          existing="$(find supabase/migrations -maxdepth 1 -type f -name '*_api_credential_token_auth_foundation.sql' -print -quit)"
          if [ -n "${existing}" ]; then
            echo "A1 foundation migration already exists: ${existing}"
            exit 0
          fi
          supabase migration new api_credential_token_auth_foundation
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_api_credential_token_auth_foundation.sql' -print -quit)"
          test -n "${generated}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated}"
          git commit -m "db: create A1 token auth foundation migration"
          git push origin "HEAD:${{ github.head_ref }}"

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Run pgTAP database contracts
        run: supabase test db supabase/tests/database

  sandbox-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Load deterministic local sandbox fixture
        run: bash scripts/seed-local-sandbox
      - name: Reload fixture to prove idempotency
        run: bash scripts/seed-local-sandbox
      - name: Run K5 fixture contracts
        run: supabase test db supabase/tests/fixtures

  runtime-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0
      - name: Start isolated Postgres
        run: supabase db start
      - name: Provision production-like local runtime identities
        run: bash scripts/provision-local-runtime-identities
      - name: Run K6 structural runtime contracts
        run: supabase test db supabase/tests/runtime
      - name: Verify API runtime identity through its own connection
        env:
          SWIFTPAY_API_DATABASE_URL: postgresql://swiftpay_api_runtime:local_api_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary api
      - name: Verify worker runtime identity through its own connection
        env:
          SWIFTPAY_WORKER_DATABASE_URL: postgresql://swiftpay_worker_runtime:local_worker_runtime_only@127.0.0.1:54322/postgres
        run: bash scripts/verify-runtime-database-boundary worker
