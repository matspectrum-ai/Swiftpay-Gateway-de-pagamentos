name: A23 application diagnostics

on:
  push:
    branches:
      - agent/foundation-phase-0
    paths:
      - ".github/workflows/a23-application-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application workspace
        run: pnpm build
      - name: Capture sanitized failure summary
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/application-test-output.txt 2>&1
          status=$?
          set -e
          mkdir -p .diagnostics
          {
            printf 'exit_code=%s\n' "$status"
            grep -E '^(not ok|# Subtest:|  error:|  code:|  actual:|  expected:|  operator:)|ERR_ASSERTION|AssertionError|tests/application/[0-9]{3}_[^ :)]+' /tmp/application-test-output.txt || true
          } > .diagnostics/a23-application-failures.txt
      - name: Persist sanitized failure summary
        shell: bash
        run: |
          git config user.name "swiftpay-ci-diagnostics"
          git config user.email "swiftpay-ci-diagnostics@users.noreply.github.com"
          git add .diagnostics/a23-application-failures.txt
          git commit -m "ci(a23): persist sanitized application failure summary" || exit 0
          git push origin HEAD:agent/foundation-phase-0
