name: A23 source-contract reconciliation

on:
  push:
    branches:
      - agent/foundation-phase-0
    paths:
      - ".github/workflows/a23-application-diagnostics.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Point pre-A23 source-inspection contracts at their frozen implementation layer
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "apps/api/src/app.ts": "apps/api/src/app-base.ts",
              "apps/api/src/runtime.ts": "apps/api/src/runtime-base.ts",
              "apps/dashboard/src/app.tsx": "apps/dashboard/src/app-base.tsx",
              "apps/dashboard/src/api.ts": "apps/dashboard/src/api-base.ts",
          }
          changed = []
          for path in sorted(Path("tests/application").glob("*.test.mjs")):
              if path.name.startswith("066_"):
                  continue
              original = path.read_text()
              updated = original
              for before, after in replacements.items():
                  updated = updated.replace(before, after)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit("No legacy source-inspection paths required reconciliation")
          print("Reconciled:")
          print("\n".join(changed))
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "swiftpay-ci-reconciliation"
          git config user.email "swiftpay-ci-reconciliation@users.noreply.github.com"
          git add tests/application
          git commit -m "test(a23): reconcile composed source boundaries"
          git push origin HEAD:agent/foundation-phase-0
