          replace(
              'docs/product/v1-readiness-status.md',
              'Conservative risk/effort-weighted readiness after A19 closure remains:',
              'Conservative risk/effort-weighted readiness after A21 closure remains:'
          )
          replace(
              'docs/product/v1-readiness-status.md',
              'A10-A19 deliberately do not increase these estimates.',
              'A10-A21 do not justify a material increase to these risk-weighted estimates.'
          )
          replace(
              'docs/product/v1-readiness-status.md',
              'K1-K7 and A1-A19 are DONE. A5 remains fixture-only for live-provider authority and A10 default retained-provider runtime authority remains zero.',
              'K1-K7 and A1-A21 are DONE. A5 remains fixture-only for live-provider authority and A10 default retained-provider runtime authority remains zero. A21 adds the first actual merchant web application while preserving browser authority through Supabase Auth and trusted SwiftPay APIs only.'
          )
          replace(
              'docs/product/v1-readiness-status.md',
              '24. Fastify request-log compatibility through the stock `LogController`, with `FSTDEP023` removed while A12 remains the sole SwiftPay HTTP logging authority.',
              '''24. Fastify request-log compatibility through the stock `LogController`, with `FSTDEP023` removed while A12 remains the sole SwiftPay HTTP logging authority;\n25. exact versioned runtime capability attestation;\n26. merchant-facing React/Vite dashboard with Supabase Auth login/session UX, authorized merchant/environment discovery, transaction list/detail and explicit failure/empty states.'''
          )
          replace(
              'docs/product/v1-readiness-status.md',
              '## A19 checkpoint — Fastify LogController compatibility',
              '''## A21 checkpoint — merchant dashboard web foundation\n\nEvidence: `docs/evidence/application/2026-08-19-a21-merchant-dashboard-web-foundation.md`.\n\nAccepted behavior/fix head before evidence documentation: `98b7b24073e8291a16984492236b4bf1339c0d6f`.\n\n- Application workflow `32257443845`: **372/372 application contracts PASS**, typecheck/build GREEN.\n- Real PostgreSQL runtime rerun job `96084137179`: K7/A14/A18/A1-A9 all GREEN.\n- Database workflow `32257443899`: K5/K6 GREEN and **44 files / 1340 pgTAP assertions PASS**.\n- Hosted migration `20260819132759_dashboard_context_discovery`.\n- Hosted A18 concurrency repair migration `20260819132824_abuse_subject_hmac_rotation_canonical_insert_order`.\n- Hosted exact capability set: **25 API / 6 worker**, missing 0, extra 0.\n- Data API effective EXECUTE on the touched functions: 0; direct API/worker protected-relation DML: 0/0.\n- Hosted Security Advisor: 0 lints; Payments/ProviderAttempts: 0/0.\n- `apps/dashboard` now provides login/logout/session refresh, merchant/environment selection, transaction list/detail and explicit loading/empty/error/session-expired states.\n- API credential/webhook settings UI, KYC/payout/refund UX, hosted checkout/Payment Links and broader reporting remain future product slices.\n- A5/A10/A11 provider safety gates are unchanged; A21 causes no live retained-provider call or provider activation.\n\nA21 closes the previous “no visual dashboard application” gap for the first read-only merchant vertical slice without granting the browser direct database, provider or financial authority.\n\n## A19 checkpoint — Fastify LogController compatibility'''
          )
