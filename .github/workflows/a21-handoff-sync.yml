          )
          # The previous replacement includes these two lines; remove duplicate occurrences if present.
          text = Path('TODOS.md').read_text()
          text = text.replace('- Dashboard API credential UI — `PENDING`\n- Dashboard webhook endpoint UI — `PENDING`\n- Dashboard API credential UI — `PENDING`\n- Dashboard webhook endpoint UI — `PENDING`', '- Dashboard API credential UI — `PENDING`\n- Dashboard webhook endpoint UI — `PENDING`')
          Path('TODOS.md').write_text(text)
