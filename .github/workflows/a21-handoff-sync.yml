name: A21 handoff sync

on:
  push:
    branches:
      - agent/foundation-phase-0

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-phase-0
          fetch-depth: 0
      - name: Synchronize canonical A21 status
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # TODOS.md
          replace('TODOS.md', '- A1-A20: `DONE`', '- A1-A21: `DONE`')
          replace(
              'TODOS.md',
              'Important product-surface qualifier: these percentages are engineering/risk-weighted and are not a claim that the merchant-facing visual product is 75-97% complete. There is currently no web dashboard application in `apps/`; the implemented dashboard work is the trusted API/auth/database surface used by a future UI.',
              'Important product-surface qualifier: these percentages are engineering/risk-weighted and are not a claim that the merchant-facing visual product is 75-97% complete. A21 now provides the first real merchant web application in `apps/dashboard` with Supabase Auth login/session UX, merchant/environment context selection and transaction list/detail. API-credential settings, webhook settings, KYC/payout/refund, hosted checkout/Payment Links and broader reporting remain separate product slices.'
          )
          replace(
              'TODOS.md',
              '## Latest accepted slices\n\n### A20 — runtime capability manifest & exact attestation — `DONE / GREEN / HOSTED-ATTESTED`',
              '''## Latest accepted slices\n\n### A21 — merchant dashboard web foundation — `DONE / GREEN / HOSTED`\n\n- Problem Analysis: `docs/design/a21-merchant-dashboard-web-foundation-problem-analysis.md`\n- Spec: `docs/specs/merchant-dashboard-web-foundation-v0.yaml`\n- Contract: `docs/contracts/merchant-dashboard-web-foundation-v0.md`\n- Evidence: `docs/evidence/application/2026-08-19-a21-merchant-dashboard-web-foundation.md`\n- Accepted behavior/fix head before evidence documentation: `98b7b24073e8291a16984492236b4bf1339c0d6f`.\n- Application workflow `32257443845`: **372/372 PASS**, typecheck/build GREEN.\n- Real PostgreSQL runtime rerun job `96084137179`: K7/A14/A18/A1-A9 all GREEN.\n- Database workflow `32257443899`: **44 files / 1340 pgTAP assertions PASS**, K5/K6 GREEN.\n- Hosted migration: `20260819132759_dashboard_context_discovery`.\n- A18 concurrency repair hosted migration: `20260819132824_abuse_subject_hmac_rotation_canonical_insert_order`.\n- Hosted exact capability attestation: missing **0**, extra **0**, API **25**, worker **6**.\n- Hosted Data API EXECUTE on touched functions: **0**; direct API/worker protected-relation DML: **0 / 0**.\n- Hosted Security Advisor: **0 lints**; Payments/ProviderAttempts: **0 / 0**.\n- `apps/dashboard` now provides login/session refresh/logout, merchant/environment selection, transaction list/detail and explicit empty/error/session-expired states.\n- Browser authority remains Supabase Auth + SwiftPay API only; no direct database/provider/financial authority was introduced.\n\n### A20 — runtime capability manifest & exact attestation — `DONE / GREEN / HOSTED-ATTESTED`'''
          )
          replace(
              'TODOS.md',
              'Runtime identities remain separate and capability-scoped. Current hosted capability set is exactly the versioned **24 API / 6 worker** `app` EXECUTE signatures, with zero public/Data API `app` authority and zero direct app-table privileges for trusted runtime roles.',
              'Runtime identities remain separate and capability-scoped. Current hosted capability set is exactly the versioned **25 API / 6 worker** `app` EXECUTE signatures, with zero public/Data API `app` authority and zero direct app-table privileges for trusted runtime roles. A21 adds only `app.list_dashboard_merchant_contexts(uuid)` to the API capability set.'
          )
          replace(
              'TODOS.md',
              '''- A16 dashboard transaction cursor HMAC rotation — `DONE / GREEN`\n\nCurrent visual-product reality:\n\n- there is **no merchant dashboard web application yet**; `apps/` currently contains only API and worker workloads;\n- the existing dashboard work is the server/API/security substrate for that future web application.\n\nRemaining product surfaces:\n\n- Merchant dashboard web app and login/session UX — `PENDING`\n- Dashboard transaction UI — `PENDING`''',
