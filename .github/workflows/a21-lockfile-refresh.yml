name: A21 lockfile refresh

on:
  push:
    branches: [agent/foundation-phase-0]
    paths:
      - "apps/dashboard/package.json"
      - ".github/workflows/a21-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-phase-0
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = "11.17.0"
      - name: Refresh canonical lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(a21): refresh pnpm lockfile"
          git push origin HEAD:agent/foundation-phase-0
