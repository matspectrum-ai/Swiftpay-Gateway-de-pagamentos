    - external_ref_uses_stable_client_reference
    - missing_customer_fails_without_placeholder
    - deterministic_CPF_CNPJ_typing
    - success_normalization
    - malformed_2xx_execution_unknown
    - unproven_4xx_execution_unknown
    - 5xx_execution_unknown
    - ambiguous_transport_execution_unknown
    - no_second_monetary_POST
    - query_uses_provider_payment_id
    - known_status_mapping
    - unknown_status_fail_closed
    - payout_requires_withdrawalKey
