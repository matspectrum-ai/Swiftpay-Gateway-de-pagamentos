red_gate:
  required_before_implementation: true
  existing_A1_A4_failures_allowed: 0
  harness_errors_allowed: 0
  parser_errors_allowed: 0
  module_resolution_errors_allowed: 0
  assertion_level_failure_required: true
  missing_package_rule: >-
    Tests must deliberately detect the absent packages/providers implementation
    and fail assertions; an uncaught ERR_MODULE_NOT_FOUND is not a clean RED.

implementation_gate:
  requires:
    - frozen YAML
    - fixture manifests and deterministic cases committed
    - all four A5 RED test files committed
    - A1-A4 application tests remain GREEN
    - A5 failures are clean assertion-level RED
    - database contracts remain GREEN
  minimal_green_only: true
  live_transport_allowed: false

acceptance:
  A5_done_requires:
    - common provider fixture conformance GREEN
    - AkkadPag fixture conformance GREEN
    - FlevoPay fixture conformance GREEN
    - fixture security and network guard GREEN
    - all A1-A4 tests remain GREEN
    - no live PSP call
    - no real provider secret or PII introduced
    - evidence report records fixture_only status and activation blockers
  A5_done_does_not_mean:
    - AkkadPag production ready
    - AkadPay equivalent to AkkadPag
    - FlevoPay production ready
    - FlevoPay Pix Out supported
    - provider webhook authentication proven current
    - missing-record reconciliation semantics proven

invariants:
  - SwiftPay remains authoritative for canonical Payment and ledger state.
  - Provider facts are bound to evidence classification and contract lineage.
  - Historical compatibility never becomes production activation implicitly.
  - AkkadPag and AkadPay equivalence remains unresolved.
  - FlevoPay Pix Out remains unsupported in A5.
  - Unknown provider status never defaults to pending or processing.
  - Monetary transport ambiguity becomes execution_unknown.
  - Monetary POSTs are never transparently retried.
  - Missing provider record does not prove non-execution by default.
  - Customer identity and contact data are never synthesized.
  - Unverified provider webhooks have no trusted financial authority.
  - Unsupported capability fails before external I/O.
  - A5 is network-free and introduces no database or financial side effect.
