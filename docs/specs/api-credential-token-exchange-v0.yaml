feature: api-credential-token-exchange-v0
status: frozen_for_tdd
phase: 3

problem:
  statement: >-
    K7 provides an executable least-privilege API runtime, but machine clients
    still cannot authenticate. SwiftPay needs the first public authentication
    endpoint without weakening the private app schema, storing plaintext
    secrets, coupling token issuance to Production KYC, or prematurely solving
    dashboard credential management before the required step-up contract exists.

objectives:
  - Implement POST /v1/auth/token on the K7 Fastify API.
  - Preserve the proven legacy client-credentials JSON request shape.
  - Verify high-entropy merchant secrets using a versioned memory-hard verifier representation.
  - Issue short-lived signed JWT access tokens with the canonical merchant/credential/environment/version claims.
  - Revalidate credential status, version, merchant and environment on every future protected-request authentication boundary.
  - Add only the minimum PostgreSQL capabilities required by the trusted API runtime.
  - Enforce an atomic credential token-issuance rate limit.
  - Keep create/rotate/revoke management outside this slice until dashboard step-up authorization is frozen.

legacy_compatibility_evidence:
  request:
    method: POST
    path: /v1/auth/token
    json_fields:
      grantType: client_credentials
      publicKey: string
      secretKey: string
  response_concepts:
    - accessToken
    - tokenType
    - expiresIn
    - environment
  token_claims:
    - merchant_id
    - credential_id
    - environment
    - secret_version
    - jti
    - iat
    - exp
  legacy_signing_algorithm: HS256
  intentionally_not_preserved:
    - legacy nullable BaseResponse wrapper
    - unsalted single SHA-256 secret verification
    - wildcard IP allowlist entry
    - in-process-only token rate limiter

http_contract:
  endpoint:
    method: POST
    path: /v1/auth/token
    authentication: none
    content_type: application/json
    request:
      grantType:
        type: string
        required: true
        allowed: [client_credentials]
      publicKey:
        type: string
        required: true
        trim: true
        max_length: 160
      secretKey:
        type: string
        required: true
        trim: false
        max_length: 512
    success:
      status: 200
      body:
        accessToken: string
        tokenType: Bearer
        expiresIn: 900
        environment: sandbox | production
    errors:
      malformed_request:
        status: 400
        code: validation_error
      unknown_public_key_or_wrong_secret:
        status: 401
        code: invalid_credentials
        indistinguishable: true
      revoked_credential:
        status: 401
        code: invalid_credentials
      inactive_merchant:
        status: 401
        code: invalid_credentials
      ip_mismatch:
        status: 403
        code: ip_not_allowed
      issuance_rate_limit:
        status: 429
        code: auth_rate_limit_exceeded
        retry_after_header: required
      unexpected_failure:
        status: 500
        code: internal_error
    error_envelope:
      required:
        error:
          code: string
          message: string
          requestId: string
      forbidden:
        - secretKey
        - secret_verifier
        - database_url
        - SQL details
        - stack trace

credential_verifier_contract:
  algorithm: scrypt
  representation_version: scrypt-v1
  parameters:
    N: 16384
    r: 8
    p: 1
    derived_key_bytes: 32
    salt_bytes: 16
  format: scrypt-v1$16384$8$1$<base64url-salt>$<base64url-derived-key>
  verification:
    constant_time_compare: required
    malformed_verifier: fail_closed
  plaintext_secret:
    persisted: forbidden
    logged: forbidden
    returned_by_this_slice: false

jwt_contract:
  library:
    package: jose
    pinned_version: 6.2.4
  algorithm: HS256
  issuer: swiftpay
  audience: swiftpay-api
  ttl_seconds: 900
  signing_key_env: SWIFTPAY_ACCESS_TOKEN_SIGNING_KEY
  signing_key_minimum_bytes_utf8: 32
  required_claims:
    sub: merchant_id
    credential_id: uuid
    environment: sandbox | production
    secret_version: positive_integer
    jti: uuid
    iat: unix_seconds
    exp: unix_seconds
  validation:
    - signature
    - algorithm exactly HS256
    - issuer
    - audience
    - expiration with zero application-added clock skew
    - required claim shapes
  server_revalidation_after_signature:
    required: true
    checks:
      - credential still exists
      - credential status is active
      - credential secret_version equals token secret_version
      - credential merchant_id equals token sub
      - credential environment equals token environment
      - merchant lifecycle_status is active
  implication: >-
    Revocation and secret rotation invalidate previously issued tokens on the
    next protected request even if JWT exp has not elapsed.

configuration_contract:
  api_additions:
    required:
      - SWIFTPAY_ACCESS_TOKEN_SIGNING_KEY
    validation:
      SWIFTPAY_ACCESS_TOKEN_SIGNING_KEY:
        minimum_utf8_bytes: 32
        error_must_not_echo_value: true
  provider_credentials: forbidden
  supabase_service_role: forbidden

ip_policy:
  v0_mode: exact_ip_only
  storage_shape: >-
    app.api_credentials.ip_allowlist is either null or a JSON array of canonical
    IP address strings.
  semantics:
    null: unrestricted
    empty_array: unrestricted
    non_empty_array: request IP must exactly match one normalized entry
  wildcard: forbidden
  cidr: deferred
  malformed_stored_value: fail_closed
  source: request.ip
  proxy_trust: >-
    K7 Fastify defaults remain authoritative until deployment topology explicitly
    freezes trusted proxy hops; arbitrary X-Forwarded-For is not trusted by this slice.

rate_limit_contract:
  scope: credential_id
  limit: 10
  window_seconds: 3600
  distributed_source_of_truth: PostgreSQL
  consume_after:
    - credential exists and active
    - merchant active
    - secret verified
    - IP policy accepted
  atomic: true
  behavior:
    allowed: increments issuance count and updates last_used_at
    denied: does not issue token and returns retry_after_seconds
  note: >-
    Invalid-secret abuse protection remains a deployment/WAF concern; consuming
    the credential issuance quota before secret verification would allow a
    public-key-based denial-of-service attack.

database_contract:
  current_table: app.api_credentials
  new_private_table:
    name: app.api_credential_token_windows
    purpose: atomic successful-token issuance quota
    key: credential_id
    columns:
      - credential_id
      - window_started_at
      - issued_count
      - updated_at
  trusted_api_functions:
    - name: app.lookup_api_credential_for_token
      inputs: [public_key]
      behavior: >-
        Return only the credential/merchant fields required to perform trusted
        application verification. Missing credential returns no row. No mutation.
    - name: app.consume_api_token_issuance
      inputs: [credential_id]
      behavior: >-
        Atomically enforce 10 successful token issuances per rolling fixed
        one-hour window, update last_used_at only on allowed consumption, and
        return allowed/remaining/retry_after_seconds.
    - name: app.get_api_credential_auth_state
      inputs: [credential_id]
      behavior: >-
        Return current credential/merchant status, environment and secret_version
        for server-side bearer-token revalidation. No mutation.
  security:
    security_definer: true
    fixed_search_path: required
    execute_allowlist: [swiftpay_api]
    execute_denied:
      - PUBLIC
      - anon
      - authenticated
      - service_role
      - swiftpay_worker
    direct_table_access_for_swiftpay_api: forbidden
    direct_table_access_for_swiftpay_worker: forbidden

application_modules:
  new_package:
    path: packages/auth
    responsibilities:
      - scrypt verifier parsing/verification
      - JWT issue/verify
      - canonical machine principal type
      - IP allowlist evaluation
  api_responsibilities:
    - request schema validation
    - request ID/error mapping
    - call trusted credential lookup
    - secret verification
    - IP policy
    - atomic issuance quota
    - JWT issuance
  protected_request_boundary:
    implementation_required: reusable function_or_hook
    public_business_route_required: false

security_and_logging:
  - Secret Key and verifier never appear in structured logs.
  - Authorization headers remain redacted by K7 logging.
  - Unknown key and wrong secret return the same public 401 response.
  - Database routines never receive plaintext Secret Key.
  - Database routines never generate or sign JWTs.
  - Token signing key never enters PostgreSQL.
  - Token payload contains no provider identity, KYC document data or secret material.
  - Authentication endpoint does not grant Production financial capability; monetary routes will apply merchant/KYC policy separately.

requirements:
  - id: A1-R1
    statement: POST /v1/auth/token preserves grantType/publicKey/secretKey compatibility and direct V2 success/error envelopes.
  - id: A1-R2
    statement: Plaintext merchant API secrets are never persisted or logged.
  - id: A1-R3
    statement: Secret verification uses the frozen scrypt-v1 representation and constant-time equality.
  - id: A1-R4
    statement: Unknown key, wrong secret, revoked credential and inactive merchant do not disclose credential existence.
  - id: A1-R5
    statement: Exact-IP allowlist is fail-closed; wildcard and malformed stored policies are rejected.
  - id: A1-R6
    statement: Successful token issuance is atomically limited to 10 per credential per hour across API instances.
  - id: A1-R7
    statement: JWT is HS256, 900 seconds, and contains the canonical merchant/credential/environment/version identity claims.
  - id: A1-R8
    statement: Bearer authentication revalidates credential status/version/merchant/environment against PostgreSQL after signature validation.
  - id: A1-R9
    statement: K6 least privilege is preserved; only explicit new functions are executable by swiftpay_api.
  - id: A1-R10
    statement: Token exchange creates no Payment, ledger, job or merchant-webhook state.
  - id: A1-R11
    statement: Existing database, K5, K6 and K7 suites remain GREEN.

acceptance_criteria:
  - Valid sandbox fixture credential returns a 200 Bearer token with 900-second expiry and sandbox environment.
  - Wrong secret and unknown public key return the identical 401 error code/message shape.
  - Revoked credential cannot issue a token.
  - Inactive merchant credential cannot issue a token.
  - Exact-IP allowlist match succeeds; mismatch returns 403.
  - Eleven successful issuance attempts in one window result in ten 200 responses and one deterministic 429 with Retry-After.
  - The same quota is visible through two independent API process/pool instances.
  - Token claims match canonical DB identity and never include the plaintext secret/verifier.
  - A token issued before credential revocation is rejected by bearer revalidation immediately after revocation.
  - A token issued before secret_version increment is rejected immediately after the increment.
  - API runtime still has no direct app.api_credentials or app.api_credential_token_windows table DML.
  - Worker cannot execute the new auth routines.
  - Auth attempts leave Payment, ledger, jobs and merchant webhook event counts unchanged.

edge_cases:
  - publicKey exists with malformed secret_verifier.
  - stored ip_allowlist is non-array JSON.
  - stored IP entry is invalid or wildcard.
  - secret contains leading/trailing whitespace and must be treated as opaque.
  - signing key is fewer than 32 UTF-8 bytes.
  - token has correct signature but wrong issuer/audience/algorithm.
  - token is expired.
  - token credential_id does not exist.
  - merchant changes from active to suspended after token issuance.
  - two issuance requests race at the ninth/tenth/eleventh quota boundary.
  - one API instance starts a rate window and another instance consumes it.
  - database failure occurs after secret verification but before quota consumption.

out_of_scope:
  - Dashboard credential create/rotate/revoke endpoints.
  - Step-up/MFA/re-auth workflow.
  - Production monetary KYC/capability gate.
  - Pix/payment endpoints.
  - Provider credentials or provider HTTP.
  - Invalid-secret distributed brute-force/WAF controls.
  - CIDR allowlists.
  - JWT signing-key rotation/key ring.
  - Refresh tokens.
  - OAuth authorization-code flows.

next_slice_after_green:
  name: pix-create-get-emulator-v0
  intent: >-
    Use the authenticated machine principal to implement Pix create/get with
    database idempotency and a deterministic provider emulator before any live PSP call.
