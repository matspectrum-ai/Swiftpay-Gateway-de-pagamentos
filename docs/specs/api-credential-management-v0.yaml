feature: api-credential-management-v0
status: frozen_for_tdd
phase: 5
date: 2026-08-17

problem:
  statement: >-
    A1 proves machine client_credentials authentication and immediate bearer
    revalidation, while A6/K4 prove dashboard identity and current merchant-role
    authorization. SwiftPay still lacks a trusted dashboard surface to create,
    inspect, rotate and revoke machine API credentials. A8 must add that surface
    without exposing plaintext secrets to PostgreSQL, weakening A1, granting
    browser/Data API authority, or allowing a normal AAL1 dashboard session to
    perform security-sensitive mutations.

source_of_truth:
  problem_analysis:
    - docs/design/a8-api-credential-management-problem-analysis.md
  predecessors:
    - docs/specs/api-credential-token-exchange-v0.yaml
    - docs/specs/dashboard-session-authentication-v0.yaml
    - docs/specs/trusted-runtime-database-boundary-v0.yaml
  existing_schema:
    - supabase/migrations/20260814005500_identity_compliance_and_providers.sql
    - supabase/migrations/20260814010000_payment_idempotency_and_provider_events.sql
    - supabase/migrations/20260815022800_audit_events_behavior.sql
    - supabase/migrations/20260815032700_trusted_runtime_database_boundary_behavior.sql

precedence:
  - A1 remains authoritative for scrypt-v1 verifiers, token issuance and protected-request bearer revalidation.
  - A6 remains authoritative for ordinary dashboard-session verification.
  - K4 remains authoritative for current merchant/environment/role authorization.
  - A8 adds a distinct privileged dashboard-session verifier for mutation step-up only.
  - Production credential creation is authentication administration and does not itself authorize Production money movement.

objectives:
  - Add dashboard list/get/create/rotate-secret/revoke API credential operations.
  - Keep reads on the ordinary A6 dashboard session boundary.
  - Require an online-validated AAL2 Supabase session for every credential mutation.
  - Require environment-sensitive current merchant role authorization.
  - Generate public and secret credential material only in trusted API memory with a CSPRNG.
  - Persist only public key plus the frozen A1 scrypt-v1 verifier.
  - Return plaintext Secret Key only on the winning create or rotation response.
  - Reuse durable request idempotency and append-only audit primitives.
  - Add positive credential revision for rotate/revoke optimistic concurrency.
  - Preserve A1 immediate invalidation through status and secret_version revalidation.
  - Preserve zero direct protected-table authority for swiftpay_api and swiftpay_worker.
  - Preserve zero Payment, ledger, provider, payout/refund, job and webhook effects.

non_objectives:
  - MFA enrollment/challenge/verification UI.
  - Credential rename.
  - IP allowlist edit after create.
  - Credential un-revoke.
  - Hard delete.
  - JWT signing-key rotation.
  - CIDR or wildcard IP policy.
  - Provider account credentials.
  - Production KYC or monetary capability policy.
  - Live PSP calls.

route_realm:
  prefix: /dashboard/v1
  base_path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials
  machine_bearer_fallback: forbidden
  merchantId:
    type: uuid
  environment:
    allowed: [sandbox, production]

authorization:
  reads:
    session_boundary: A6
    online_supabase_auth_validation: required
    minimum_role: member
    aal2_required: false
  mutations:
    session_boundary: A8_privileged_dashboard_session
    sequence:
      - parse exactly one strict dashboard Bearer token
      - validate token online against configured Supabase Auth project
      - obtain canonical Supabase user id from successful online validation
      - decode only the already-validated JWT payload
      - cross-check JWT sub against canonical validated user id
      - require aal claim to equal aal2
      - authorize current merchant/environment role through K4
      - execute one operation-specific trusted database routine
    missing_or_aal1_claim:
      result: step_up_required
      database_mutation: forbidden
      secret_generation: forbidden
    malformed_or_rejected_session:
      result: invalid_session
      database_access: forbidden
      secret_generation: forbidden
    auth_transport_or_unexpected_upstream_failure:
      result: authentication_unavailable
      database_access: forbidden
      secret_generation: forbidden
    forbidden_authority_sources:
      - service_role
      - sb_secret
      - legacy_supabase_jwt_secret
      - local_signature_only_trust
      - A1_machine_credentials
      - user_metadata
  mutation_roles:
    sandbox:
      allowed: [admin, owner]
    production:
      allowed: [owner]

supabase_aal_contract:
  accepted_mutation_level: aal2
  ordinary_level: aal1
  claim: aal
  sub_cross_check_after_online_validation: required
  missing_aal_behavior: step_up_required
  note: >-
    Current Supabase Auth documentation defines aal2 as a session additionally
    verified by a second factor and represents assurance in the JWT aal claim.

credential_material:
  public_key:
    sandbox: pk_sandbox_<base64url_18_random_bytes_no_padding>
    production: pk_production_<base64url_18_random_bytes_no_padding>
    persisted: true
    uniqueness: global
  secret_key:
    sandbox: sk_sandbox_<base64url_32_random_bytes_no_padding>
    production: sk_production_<base64url_32_random_bytes_no_padding>
    persisted_plaintext: forbidden
    logged: forbidden
    audit: forbidden
    idempotency_snapshot: forbidden
    error_object: forbidden
  randomness:
    source: node_crypto_randomBytes
    cryptographically_secure: required
  verifier:
    contract: A1_scrypt-v1
    persisted: true
    plaintext_input_only_in_trusted_api_memory: true

credential_projection:
  fields:
    id: uuid
    merchantId: uuid
    environment: sandbox | production
    name: string
    publicKey: string
    status: active | revoked
    secretVersion: positive_integer
    revision: positive_integer
    ipAllowlist: null | array_of_exact_ip_strings
    lastUsedAt: utc_rfc3339 | null
    createdAt: utc_rfc3339
    rotatedAt: utc_rfc3339 | null
    revokedAt: utc_rfc3339 | null
  forbidden:
    - secret_verifier
    - accessToken
    - authorizationHeader

input_contract:
  name:
    type: string
    trim: true
    minimum_length: 1
    maximum_length: 120
    decision: A8_v0_application_boundary
  ip_allowlist:
    omitted_or_null: unrestricted
    empty_array_normalizes_to: null
    maximum_entries: 32
    duplicates: forbidden
    wildcard: forbidden
    cidr: forbidden
    malformed: validation_error
    semantics: exact_ip_only
  idempotency_key:
    trim: true
    minimum_length: 1
    maximum_length: 160

http_contract:
  list:
    method: GET
    path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials
    authentication: A6_dashboard_session
    minimum_role: member
    success_status: 200
    body:
      object: list
      data: credential_projection_array
    ordering: [createdAt_desc, id_desc]
  get:
    method: GET
    path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials/{credentialId}
    authentication: A6_dashboard_session
    minimum_role: member
    success_status: 200
    foreign_or_missing_status: 404
    disclosure_rule: foreign_and_missing_are_indistinguishable
  create:
    method: POST
    path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials
    authentication: A8_privileged_dashboard_session
    required_header: Idempotency-Key
    body:
      strict_unknown_fields: true
      fields:
        name:
          required: true
          rules: input_contract.name
        ipAllowlist:
          required: false
          rules: input_contract.ip_allowlist
    first_success:
      status: 201
      credential: credential_projection
      secretAvailable: true
      secretKey: plaintext_once
      replayed: false
    completed_replay:
      status: 200
      credential: original_public_projection_snapshot
      secretAvailable: false
      secretKey: null
      replayed: true
  rotate_secret:
    method: POST
    path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials/{credentialId}/rotate-secret
    authentication: A8_privileged_dashboard_session
    required_header: Idempotency-Key
    body:
      strict_unknown_fields: true
      expectedRevision: positive_integer_required
    first_success:
      status: 200
      credential: credential_projection
      secretAvailable: true
      secretKey: plaintext_once
      replayed: false
    completed_replay:
      status: 200
      credential: original_public_projection_snapshot
      secretAvailable: false
      secretKey: null
      replayed: true
  revoke:
    method: POST
    path: /dashboard/v1/merchants/{merchantId}/environments/{environment}/api-credentials/{credentialId}/revoke
    authentication: A8_privileged_dashboard_session
    required_header: Idempotency-Key
    body:
      strict_unknown_fields: true
      expectedRevision: positive_integer_required
    success_status: 200
    completed_replay_status: 200

http_errors:
  validation_error: {status: 400}
  invalid_session: {status: 401}
  step_up_required: {status: 403}
  forbidden: {status: 403}
  resource_not_found: {status: 404}
  idempotency_conflict: {status: 409}
  idempotency_in_progress: {status: 409}
  resource_conflict: {status: 409}
  credential_limit_reached: {status: 409}
  authentication_unavailable: {status: 503}
  internal_error: {status: 500}
  error_envelope:
    required:
      error:
        code: string
        message: string
        requestId: string
    forbidden:
      - secretKey
      - secret_verifier
      - authorizationHeader
      - accessToken
      - SQL_details
      - stack_trace

idempotency:
  table: app.request_idempotency
  required_for: [create, rotate_secret, revoke]
  operation_names:
    create: dashboard_api_credential_create_v0
    rotate_secret: dashboard_api_credential_rotate_secret_v0
    revoke: dashboard_api_credential_revoke_v0
  canonical_request_hash:
    digest: SHA256
    encoding: lowercase_hex
    canonical_json: recursively_sorted_object_keys_no_whitespace
    create_include: [operation, merchantId, environment, normalized_name, normalized_ipAllowlist]
    rotate_include: [operation, merchantId, environment, credentialId, expectedRevision]
    revoke_include: [operation, merchantId, environment, credentialId, expectedRevision]
    exclude:
      - generated_public_key
      - generated_plaintext_secret
      - generated_secret_verifier
      - generated_credential_id
      - request_id
  exact_completed_replay:
    evaluated_before_revision_or_status_fencing: true
    mutation_again: false
    audit_again: false
    secret_redisclosure: false
  same_key_different_hash:
    result: idempotency_conflict
    mutation: none
  same_key_same_hash_in_progress:
    result: idempotency_in_progress
    mutation: none
  response_snapshot_forbidden: [plaintext_secret, secret_verifier]

optimistic_concurrency:
  column: app.api_credentials.revision
  type: bigint
  nullable: false
  default: 1
  check: greater_than_zero
  create_revision: 1
  rotate:
    expectedRevision_required: true
    revision_increment: 1
    secret_version_increment: 1
  revoke:
    expectedRevision_required: true
    revision_increment: 1
    secret_version_increment: 0
  stale_new_idempotency_key:
    result: resource_conflict
    mutation: none
    audit: none

lifecycle:
  create_status: active
  rotate:
    allowed_status: active
    revoked_result: resource_conflict
    sets_rotated_at: current_database_time
  revoke:
    allowed_status: active
    target_status: revoked
    terminal: true
    sets_revoked_at: current_database_time
    row_deleted: false
  un_revoke: forbidden
  hard_delete: forbidden

credential_limits:
  maximum_active_per_merchant_environment: 10
  enforcement:
    transactional: true
    lock: merchant_row
  revoked_counted: false
  exceeded_result: credential_limit_reached

database_contract:
  schema_changes:
    app.api_credentials:
      add_columns:
        revision:
          type: bigint
          nullable: false
          default: 1
          check: greater_than_zero
  trusted_api_functions:
    - app.list_dashboard_api_credentials
    - app.get_dashboard_api_credential
    - app.create_dashboard_api_credential
    - app.rotate_dashboard_api_credential_secret
    - app.revoke_dashboard_api_credential
  mutation_input_boundary:
    plaintext_secret: forbidden
    secret_verifier: required_for_create_and_rotate
    generated_public_key: required_for_create_only
    verified_user_id: required
    merchant_id: required
    environment: required
  role_recheck:
    reads: member
    sandbox_mutations: admin
    production_mutations: owner
  runtime_execute_capabilities_after_A8:
    swiftpay_api: 21
    swiftpay_worker: 6
  direct_table_access:
    swiftpay_api:
      api_credentials: forbidden
      api_credential_token_windows: forbidden
      request_idempotency: forbidden
      audit_events: forbidden
    swiftpay_worker:
      api_credentials: forbidden
      api_credential_token_windows: forbidden
      request_idempotency: forbidden
      audit_events: forbidden
  private_helpers:
    prefix: _a8_
    executable_by_swiftpay_api: false
    executable_by_swiftpay_worker: false
  privileged_routines:
    fixed_search_path: required
    PUBLIC_execute: revoked
    anon_execute: revoked
    authenticated_execute: revoked
    service_role_execute: revoked

audit:
  table: app.audit_events
  exactly_once_for_winning_mutations: true
  same_transaction_as_mutation: true
  events:
    create: api_credential.created
    rotate_secret: api_credential.secret_rotated
    revoke: api_credential.revoked
  no_audit_for:
    - reads
    - invalid_session
    - step_up_required
    - authentication_unavailable
    - forbidden
    - validation_error
    - idempotency_replay
    - idempotency_conflict
    - idempotency_in_progress
    - resource_conflict
    - resource_not_found
  metadata_forbidden:
    - plaintext_secret
    - secret_verifier
    - access_token
    - authorization_header

a1_compatibility:
  token_endpoint: /v1/auth/token
  public_contract_changed: false
  rotation:
    increments_secret_version: true
    old_secret_token_exchange: invalid_credentials
    old_bearer_token_next_request: rejected_by_current_secret_version_revalidation
  revocation:
    new_token_exchange: invalid_credentials
    existing_bearer_token_next_request: rejected_by_current_status_revalidation

financial_invariance:
  no_mutation_of:
    - payments
    - provider_attempts
    - provider_events
    - accounts
    - ledger_transactions
    - ledger_entries
    - payouts
    - payout_attempts
    - refunds
    - refund_attempts
    - jobs
    - webhook_events
    - webhook_deliveries
    - webhook_endpoints

application_contracts:
  privileged_session_verifier:
    success:
      userId: uuid
      assuranceLevel: aal2
    failures: [invalid_session, step_up_required, authentication_unavailable]
    token_or_upstream_body_exposure: forbidden
  credential_material_factory:
    deterministic_in_tests_via_dependency_injection: required
    production_randomness: CSPRNG
    output: [publicKey, secretKey, secretVerifier]
  credential_store:
    direct_sql_table_access: forbidden
    methods: [list, get, create, rotateSecret, revoke]
  management_service:
    mutation_sequence:
      - privileged_session_verification
      - K4_authorization
      - input_and_idempotency_validation
      - candidate_material_generation
      - trusted_database_command
      - plaintext_candidate_return_only_when_winning_mutation
    replay_candidate_authority: forbidden

requirements:
  - id: A8-R1
    statement: List/get use only the A6 dashboard realm and current member authorization.
  - id: A8-R2
    statement: Create/rotate/revoke require an online-validated AAL2 dashboard session before secret generation or database mutation.
  - id: A8-R3
    statement: Sandbox mutations require current admin or owner; Production mutations require current owner.
  - id: A8-R4
    statement: Public/secret credential material is generated with CSPRNG in trusted API memory and plaintext Secret Key never enters PostgreSQL.
  - id: A8-R5
    statement: Persisted Secret Key authority is only the exact frozen A1 scrypt-v1 verifier.
  - id: A8-R6
    statement: Plaintext Secret Key is returned once only for the winning create or rotate response and never on completed replay.
  - id: A8-R7
    statement: Every mutation is durable-idempotent and completed replay precedes revision/status fencing.
  - id: A8-R8
    statement: Rotate increments revision and secret_version exactly once; revoke increments revision and is terminal.
  - id: A8-R9
    statement: Rotation and revocation immediately invalidate old A1 machine authority through existing revalidation semantics.
  - id: A8-R10
    statement: At most 10 active credentials exist per merchant/environment under concurrent creates.
  - id: A8-R11
    statement: Every winning mutation appends exactly one safe audit event in the same transaction.
  - id: A8-R12
    statement: swiftpay_api gains exactly five trusted routine capabilities and no direct protected-table access; swiftpay_worker gains none.
  - id: A8-R13
    statement: Public projections, errors, logs, audit and idempotency snapshots never expose secret verifier or plaintext Secret Key.
  - id: A8-R14
    statement: Credential administration has zero Payment, ledger, provider, payout/refund, job and webhook side effects.
  - id: A8-R15
    statement: A8 does not modify the A1 /v1/auth/token public contract or grant Production monetary capability.

acceptance_criteria:
  - A member can list/get credentials in an authorized merchant/environment but cannot mutate.
  - An AAL1 admin or owner receives 403 step_up_required before secret generation or database mutation.
  - An AAL2 admin can mutate Sandbox credentials but receives 403 for Production mutation.
  - An AAL2 owner can mutate Sandbox and Production credentials.
  - Create returns one public/secret pair at revision 1 and secretVersion 1 while PostgreSQL stores only the scrypt verifier.
  - Exact completed create replay returns no plaintext secret and creates no duplicate credential or audit event.
  - Changed request with the same idempotency key returns 409 idempotency_conflict.
  - Concurrent creates cannot exceed 10 active credentials per merchant/environment.
  - Rotate increments revision and secretVersion exactly once and returns one new plaintext Secret Key.
  - A machine token issued before rotation is rejected on its next protected request.
  - Exact rotation replay succeeds without another secret; a new-key stale rotation returns 409 resource_conflict.
  - Revoke is terminal, increments revision exactly once and blocks token exchange and bearer revalidation.
  - Exact revoke replay is safe and appends no second audit event.
  - Foreign and missing credentials do not disclose cross-merchant existence.
  - Public projection, logs, audit and idempotency snapshots contain no plaintext Secret Key or secret verifier.
  - API runtime has exactly 21 trusted execute capabilities and no direct protected-table authority; worker remains at exactly 6.
  - Payment, ledger, provider, payout/refund, job and webhook counts remain invariant.
  - Existing 209 application contracts, 38/1282 pgTAP baseline and K7/A1/A2/A3/A4/A6/A7 real-database acceptance remain GREEN before A8 implementation acceptance.

edge_cases:
  - Missing aal claim after successful online Supabase validation.
  - JWT sub differs from online-validated user id.
  - AAL2 session is rejected upstream before mutation.
  - Merchant membership changes between session validation and database command.
  - Duplicate, malformed, wildcard or CIDR IP entries.
  - Empty IP allowlist normalizes to null.
  - Same idempotency key races from two API instances.
  - Two creates race at the ninth/tenth/eleventh active credential boundary.
  - Generated public key collides with an existing globally unique public key.
  - Winning create response is lost.
  - Winning rotation response is lost.
  - Rotate is attempted on a revoked credential.
  - Revoke is attempted with stale revision.
  - Old bearer token remains cryptographically valid after rotation/revoke but must fail database revalidation.
  - Database failure occurs after candidate generation but before durable mutation.

clean_red:
  prerequisite_baseline:
    application_contracts: 209
    pgTAP_files: 38
    pgTAP_assertions: 1282
    runtime_acceptance: [K7, A1, A2, A3, A4, A6, A7]
  new_A8_failures_must_be:
    - assertion_level_missing_behavior
    - assertion_level_missing_structure
  forbidden_red_causes:
    - parser_error
    - typecheck_error
    - module_resolution_error
    - broken_test_harness
  hosted_supabase_migration_before_local_green: forbidden

verification:
  - typecheck application workspace
  - build application workspace
  - run all application contracts
  - run database pgTAP suite
  - run isolated PostgreSQL K7/A1/A2/A3/A4/A6/A7 regression acceptance
  - run new A8 real-database acceptance
  - prove A1 old-token invalidation after rotation and revoke
  - verify exact runtime execute allowlists
  - verify zero direct protected-table runtime privileges
  - run Supabase Security Advisor after hosted migration
  - review Performance Advisor separately without mixing unrelated optimization into A8
  - update evidence and canonical readiness/TODO ledgers only after GREEN

next_slice_after_green:
  name: merchant-transaction-operations-v0
  intent: >-
    Add dashboard list/detail/search/status operations over canonical Payment data
    after merchants can safely self-manage API credentials.
