schema: swiftpay-a17-legacy-webhook-aes-secret-retirement-v0
version: 0.1.0
status: frozen
implementation_authority: false

problem_analysis: docs/design/a17-legacy-webhook-aes-secret-retirement-problem-analysis.md

intent:
  summary: >-
    Retire the pre-A7 AES-256-GCM merchant-webhook signing-secret compatibility
    before launch, leaving RSA-OAEP-SHA256 wrapping with explicit wrapping-key
    identity as the only persisted webhook-secret cryptographic authority.
  hosted_precondition:
    project_ref: vsidrgbbyzibqfjkuiqb
    observed_at: 2026-08-18
    webhook_endpoints: 0
    webhook_secret_versions: 0
    legacy_aes_secret_versions: 0
    rule: >-
      The hosted counts are evidence, not a permanent assumption. Immediately
      before applying the A17 migration, the legacy AES count MUST be re-read
      and MUST still be zero.

scope:
  application:
    - packages/config
    - packages/webhooks
    - apps/worker
    - application tests and runtime acceptance fixtures
  database:
    - app.webhook_endpoint_secret_versions ciphertext-format/wrapping-key constraints
    - database contract tests
    - one forward-only A17 migration
  ci_deployment_acceptance:
    - prove the configured API current wrapping key ID has an exact matching worker private key in the CI deployment fixture
  explicitly_out_of_scope:
    - merchant webhook HMAC protocol redesign
    - merchant-triggered webhook signing-secret rotation semantics
    - endpoint SSRF/transport behavior changes
    - delivery retry/backoff/fencing changes
    - provider webhook ingress
    - A14 abuse HMAC changes
    - A15 access-token signing changes
    - A16 dashboard cursor HMAC changes
    - provider credentials or provider activation
    - AES ciphertext data conversion
    - live PSP calls

invariants:
  provider_runtime_authority_delta: 0
  financial_authority_delta: 0
  live_psp_calls: 0
  payment_mutations: 0
  provider_attempt_mutations: 0
  a10_default_authorized_operations: 0
  public_merchant_webhook_signature_protocol_unchanged: true
  delivery_fencing_unchanged: true
  delivery_retry_semantics_unchanged: true
  immutable_endpoint_url_snapshot_unchanged: true
  immutable_signing_secret_version_snapshot_unchanged: true

runtime_configuration:
  worker:
    remove:
      - SWIFTPAY_WEBHOOK_SECRET_ENCRYPTION_KEY
      - webhookEncryptionKey
    require:
      env: SWIFTPAY_WEBHOOK_SECRET_WRAP_PRIVATE_KEYS
      parser: parseWebhookWrappingPrivateKeyring
      cardinality:
        min: 1
        max: 16
      key_id_regex: '^[a-z0-9][a-z0-9._-]{0,63}$'
      rsa_modulus_bits:
        min: 2048
        max: 4096
      semantics: >-
        Worker bootstrap fails before entering the job loop if the private
        keyring is absent, empty, malformed, contains an invalid key ID, or
        contains a non-RSA/weak/oversized key.
  api:
    preserve:
      - SWIFTPAY_WEBHOOK_SECRET_WRAP_KEY_ID
      - SWIFTPAY_WEBHOOK_SECRET_WRAP_PUBLIC_KEY
    issuance_format: rsa-oaep-sha256-v1
  cross_workload_deployment_invariant:
    rule: >-
      In deployment/CI acceptance, the exact API current
      SWIFTPAY_WEBHOOK_SECRET_WRAP_KEY_ID MUST exist in the worker private
      keyring. This is a deployment invariant, not a shared runtime secret or a
      reason to couple API and worker process configuration loaders.
    failure: fail_closed_before_acceptance

persisted_secret_authority:
  only_format: rsa-oaep-sha256-v1
  wrapping_key_id:
    required: true
    regex: '^[a-z0-9][a-z0-9._-]{0,63}$'
  decryption:
    key_selection: exact_wrapping_key_id
    trial_all_keys: forbidden
    fallback_key: forbidden
    missing_key: signing_secret_unavailable
    malformed_ciphertext_or_decrypt_failure: signing_secret_invalid
  rotation_overlap:
    allowed: true
    mechanism: retain_old_private_key_by_exact_id
    retirement: >-
      Removing a private key deliberately retires secret versions wrapped with
      that exact key once no still-usable delivery may reference them.

webhook_delivery_service:
  input:
    remove:
      - encryptionKey
    require:
      - privateKeyring
  claim_secret_format:
    required: rsa-oaep-sha256-v1
    missing_format_default: forbidden
    aes_256_gcm: terminal_configuration_failure
    unknown_format: terminal_configuration_failure
  before_network_failure:
    outcome: terminal
    error_class: configuration
    allowed_error_codes:
      - signing_secret_unavailable
      - signing_secret_invalid
  unchanged_behavior:
    - exact snapshotted secret version
    - exact snapshotted endpoint URL
    - HMAC-SHA256 merchant webhook request signature
    - x-swiftpay-signature-version header
    - one HTTP send per claimed attempt
    - retry classification
    - lease fencing
    - secret redaction

production_exports:
  remove_runtime_aes_authority:
    - decodeWebhookEncryptionKey
    - decryptWebhookSigningSecret
  rule: >-
    Production package exports and executable delivery code MUST NOT retain an
    AES webhook-secret decrypt path. Tests may construct historical AES-shaped
    values locally only to prove migration/schema rejection; no test-only AES
    helper may be re-exported from a production package.

database_migration:
  table: app.webhook_endpoint_secret_versions
  precondition:
    query_semantics: count rows where ciphertext_format = 'aes-256-gcm-v1'
    expected: 0
    on_nonzero: abort_migration
    silent_delete: forbidden
    automatic_rewrap: forbidden
  postconditions:
    ciphertext_format:
      nullable: false
      allowed_values:
        - rsa-oaep-sha256-v1
    wrapping_key_id:
      nullable: false
      regex: '^[a-z0-9][a-z0-9._-]{0,63}$'
    rsa_ciphertext_shape: '^rsa-oaep-sha256-v1\$[A-Za-z0-9_-]+$'
    privileges:
      preserve_existing_restrictions: true
      new_runtime_table_authority: forbidden
  excluded_schema_changes:
    - dropping app.webhook_endpoints.secret_ciphertext
    - dropping app.webhook_endpoints.previous_secret_ciphertext
    - redesigning app.webhook_endpoints current/previous compatibility columns
    - new RPCs
    - new tables

historical_test_migration:
  a4_behavior_contracts:
    rule: >-
      Preserve A4 delivery, retry, signing, redaction and fencing semantics but
      migrate production-path fixtures from AES ciphertext to A7 RSA-wrapped
      ciphertext with explicit key IDs.
  a7_legacy_compat_contract:
    prior_behavior: AES compatibility
    post_a17_behavior: >-
      AES claim material is rejected terminally before network; RSA current and
      retained-key rotation compatibility remains GREEN.
  a7_real_runtime_acceptance:
    remove_required_env:
      - SWIFTPAY_WEBHOOK_SECRET_ENCRYPTION_KEY
    retain_required_env:
      - SWIFTPAY_WEBHOOK_SECRET_WRAP_KEY_ID
      - SWIFTPAY_WEBHOOK_SECRET_WRAP_PUBLIC_KEY
      - SWIFTPAY_WEBHOOK_SECRET_WRAP_PRIVATE_KEYS
    expected_secret_history_formats:
      - rsa-oaep-sha256-v1

error_safety:
  secret_values_in_errors: forbidden
  private_keys_in_errors: forbidden
  ciphertext_in_errors: forbidden
  raw_database_errors_to_merchant: forbidden
  claim_payload_echo: forbidden

verification:
  tdd_order:
    - contract_document
    - fail_first_application_tests
    - fail_first_database_tests
    - clean_red_evidence
    - minimal_implementation
    - refactor
    - full_green_evidence
    - hosted_preflight
    - hosted_migration
    - hosted_postflight
    - handoff_sync
  clean_red_requirements:
    application:
      - prove worker config still requires SWIFTPAY_WEBHOOK_SECRET_ENCRYPTION_KEY
      - prove webhook delivery still accepts AES ciphertext
      - prove production package still exports AES decrypt authority
      - prove worker private keyring is not yet mandatory
      - prove A4 fixtures still depend on AES production behavior
    database:
      - prove schema still accepts aes-256-gcm-v1 secret-version rows
      - prove wrapping_key_id may still be null for AES rows
    regressions:
      - all pre-A17 unrelated application contracts remain GREEN
      - K5 and K6 remain GREEN
      - existing database contracts remain GREEN except intentional A17 RED tests
  green_requirements:
    application:
      - full application suite GREEN
      - A17 contracts GREEN
      - K7/A1/A2/A3/A4/A6/A7/A8/A9/A14 real-database runtime acceptance GREEN
      - A4 runtime acceptance runs with RSA-only secret fixtures
      - A7 runtime acceptance runs without SWIFTPAY_WEBHOOK_SECRET_ENCRYPTION_KEY
    database:
      - full migration replay from zero GREEN
      - K5 fixtures GREEN
      - K6 topology GREEN
      - full pgTAP GREEN
      - AES insert rejected
      - null wrapping_key_id rejected
    hosted_preflight:
      - legacy_aes_secret_versions == 0
      - webhook_endpoint_secret_versions count recorded
      - payment row count recorded
      - provider_attempt row count recorded
    hosted_postflight:
      - migration applied to canonical swiftpay v2 only
      - schema allows RSA format only
      - wrapping_key_id is non-null
      - runtime/public table privileges remain denied
      - security_advisor_lints == 0
      - payment row count unchanged
      - provider_attempt row count unchanged
      - no PSP network call

readiness:
  default_effect: unchanged
  reason: >-
    A17 is pre-launch cryptographic hardening and reduces obsolete secret
    authority, but does not close the retained-PSP current-contract or
    authenticated-sandbox launch blocker.
